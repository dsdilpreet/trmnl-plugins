# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# values of custom fields (defined in src/settings.yml)
custom_fields: {}

# override variables
variables:
  quote:
    character: Joey
    text: "It's a moo point. It's like a cow's opinion; it doesn't matter. It's moo."
  trmnl:
    plugin_settings:
      instance_name: Friends Quotes
